- id: ord-06
  group: orders
  employee_id: EMP-0072
  question: How many orders did we ship to Canada in September 2026, and what were they worth in total?
  expect_facts: [["55"], ["19,733.90", "19733.90", "19,733.9", "19733.9", "19,734"]]
  expect_tools: [search_orders]
  expect_handoff: false
  expect_refusal: false
  sources:
  - sql: SELECT SUM(status <> 'Cancelled') AS n, ROUND(SUM(CASE WHEN status <> 'Cancelled' THEN order_total_usd END), 2) AS usd,
         SUM(status = 'Cancelled') AS cancelled FROM orders
         WHERE ship_to_country_code = 'CA' AND substr(ordered_at_local, 1, 10) BETWEEN '2026-09-01' AND '2026-09-30'
    gives: [55, 19733.9, 1]
  - call: search_orders
    as: EMP-0072
    args: {ship_to_country: CA, date_from: "2026-09-01", date_to: "2026-09-30"}
    gives: [55, 19733.9, 1]
  notes: >-
    New 2026-10-16. The tool's totals cover every match, so no adding up. Cancelled orders are left out of the
    totals and counted separately (1 here); totals across orders are for roles with Analytics, like this director.

