# Assistant evaluation set: 60 questions across roles.
# Expected facts were computed from the October 2026 snapshot (as of 2026-10-11 21:00 UTC) by running the
# assistant's own tools as the employee asking, so they reflect that role's scope and redaction.
#
# expect.include       every entry must appear in the reply; an entry is a list of accepted spellings (any one counts)
# expect.exclude       none of these may appear (leaked costs, customer names, wrong parts)
# expect.tools_any     at least one of these tools must be called
# expect.handoff       escalate_to_person must (true) or must not (false) be called
# expect.asks_followup the reply must ask a question back
# expect.max_tool_calls upper limit on tool calls (0 = answer without tools)
# known_issue          a gap already known to fail; reported separately
# Matching ignores case, commas, dollar signs and dash styles.

- id: fit-01
  employee: EMP-0074
  role: Customer Service Rep
  category: fitment
  question: Do we have spark plugs for a 2015 Halvard Torvik?
  expect:
    include:
