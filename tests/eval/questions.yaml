# Assistant evaluation set (docs/EVIDENCE_PLAN.md, Phase B): 50 questions in 7 groups.
#
# Data snapshot: as of Sun, Oct 11, 2026, 4:00 PM Central. Names are the fictional ones (data_generator/name_map.py).
#
# Fields
#   id, group, employee_id     who asks (their role sets the tools, scope and redaction)
#   question | turns           one question, or several turns of one conversation (graded on the last reply)
#   expect_facts               data that must appear in the answer; each entry is a value or a list of accepted spellings
#   expect_words               wording that must appear (not data), each entry a list of accepted spellings
#   forbid                     must not appear (leaked costs or names, wrong parts, false claims)
#   expect_tools               at least one of these must be called (empty: no tool needed)
#   expect_handoff             false, or the department a handoff must go to (RET, BIL, CS, DLR, EXP)
#   handoff_optional           true: a handoff isn't required, but if one happens it must go to expect_handoff
#   expect_refusal             true when the answer must decline (no access, off topic)
#   sources                    where every expect_facts value comes from: a read-only SQL query, or one of the app's own
#                              tools called as an employee. tests/test_eval_set.py re-runs each source and checks that
#                              every 'gives' value is in its result, and that every fact is backed by a source.
#
# Matching in the runner ignores case, commas, dollar signs and dash styles; numbers match whole.

