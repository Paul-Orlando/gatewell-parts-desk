<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Gatewell piston logo">
  <!-- Gatewell piston mark. Main shape uses currentColor so it works on light and dark backgrounds;
       the top compression ring is the brand amber. Cut-outs are transparent (mask), not painted white. -->
  <defs>
    <mask id="gw-cut" maskUnits="userSpaceOnUse">
      <rect width="64" height="64" fill="#fff"/>
      <!-- ring grooves -->
      <rect x="12" y="15.5" width="40" height="2.6" fill="#000"/>
      <rect x="12" y="20.5" width="40" height="2.6" fill="#000"/>
      <!-- wrist pin -->
      <circle cx="32" cy="31" r="4.2" fill="#000"/>
      <!-- connecting rod big-end bore -->
      <circle cx="32" cy="53" r="3.6" fill="#000"/>
    </mask>
  </defs>
  <g mask="url(#gw-cut)" fill="currentColor">
    <!-- crown and skirt -->
    <path d="M16 8.5h32a3.5 3.5 0 0 1 3.5 3.5v20.5c0 2.2-1.3 4.1-3.3 4.9l-3.2 1.3H19l-3.2-1.3a5.3 5.3 0 0 1-3.3-4.9V12A3.5 3.5 0 0 1 16 8.5z"/>
    <!-- connecting rod, tapering toward the big end -->
    <path d="M27.4 31h9.2l-1.6 16h-6z"/>
    <!-- big end -->
    <circle cx="32" cy="53" r="8"/>
  </g>
  <!-- top compression ring in brand amber -->
  <rect x="12.5" y="11.2" width="39" height="2.6" rx="1.3" fill="#e8a317"/>
</svg>
